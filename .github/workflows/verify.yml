name: verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_KEY: ci-admin-key
      KHABAR_TABLE_NAME: khabar-ci
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
