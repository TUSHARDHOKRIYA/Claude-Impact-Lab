<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mumbai ward repair budgets</title>
<style>
  #mumbai-budget {
    color-scheme: light dark;
    --ink: var(--foreground, light-dark(#152530, #ecf2f5));
    --subtle: var(--muted-foreground, light-dark(#4b5e6a, #afbec8));
    --line: var(--border, light-dark(#cfdbdf, #495861));
    --panel: var(--card, light-dark(#fff, #1c282e));
    --map: light-dark(#f2f6f7, #19252c);
    --teal: light-dark(#166e65, #73c9bc);
    --rust: light-dark(#a34425, #ffa982);
    --teal-fill: light-dark(#dcefea, #234139);
    --rust-fill: light-dark(#f6e1d6, #522d23);
    --radius-local: var(--radius, 12px);
    max-width: 900px;
    margin: 18px auto;
    color: var(--ink);
    font: 15px/1.45 var(--font-sans, system-ui, sans-serif);
  }
  #mumbai-budget *, #mumbai-budget *::before, #mumbai-budget *::after { box-sizing: border-box; }
  #mumbai-budget [hidden] { display: none !important; }
  #mumbai-budget h1, #mumbai-budget h2, #mumbai-budget p, #mumbai-budget dl, #mumbai-budget dd, #mumbai-budget figure { margin: 0; }
  #mumbai-budget h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.12; letter-spacing: -.035em; }
  #mumbai-budget h2 { font-size: 19px; line-height: 1.2; }
  #mumbai-budget button { font: inherit; color: inherit; cursor: pointer; }
  #mumbai-budget :is(button, [role="button"]):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #mumbai-budget .period, #mumbai-budget .footnote, #mumbai-budget .legend, #mumbai-budget .area { color: var(--subtle); }
  #mumbai-budget .period { font-size: 13px; margin-bottom: 5px; }
  #mumbai-budget .totals { margin-top: 8px; font-size: 14px; }
  #mumbai-budget .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 13px; margin: 16px 0 10px; }
  #mumbai-budget .switch { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
  #mumbai-budget .switch button { min-height: 36px; padding: 4px 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; }
  #mumbai-budget .switch button[aria-pressed="true"] { color: var(--panel); background: var(--ink); }
  #mumbai-budget .view-caption { font-size: 12px; color: var(--subtle); }
  #mumbai-budget .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(235px, .64fr); gap: 15px; align-items: start; }
  #mumbai-budget .map-field { position: relative; min-width: 0; background: var(--map); border: 1px solid var(--line); border-radius: var(--radius-local); padding: 10px 12px 13px; }
  #mumbai-budget .map-field::before { content: "↑ N"; position: absolute; inset: 12px 13px auto auto; color: var(--subtle); font-size: 12px; pointer-events: none; }
  #mumbai-budget .tile-map {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(12, 44px);
    gap: 4px;
    max-width: 386px;
    margin-inline: auto;
  }
  #mumbai-budget .ward-tile, #mumbai-budget .geo-ward { --status: var(--teal); --status-fill: var(--teal-fill); }
  #mumbai-budget .at { --status: var(--subtle); --status-fill: var(--map); }
  #mumbai-budget .over { --status: var(--rust); --status-fill: var(--rust-fill); }
  #mumbai-budget .ward-tile {
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 1px;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 2px;
    min-width: 0;
    background: var(--status-fill);
    line-height: 1.08;
    font-variant-numeric: tabular-nums;
  }
  #mumbai-budget .ward-tile:hover { border-color: var(--status); }
  #mumbai-budget .ward-tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  #mumbai-budget .ward-tile strong { font-size: 13px; }
  #mumbai-budget .ward-tile .percentage { font-size: 11px; }
  #mumbai-budget .meter { display: block; position: relative; width: 76%; height: 4px; margin-top: 2px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
  #mumbai-budget .meter::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--used); border-radius: 2px; background: var(--status); }
  #mumbai-budget .meter::after { content: ""; position: absolute; inset: -1px auto -1px var(--budget-mark); width: 1px; background: var(--ink); }
  #mumbai-budget .boundary-map { display: block; width: 100%; height: 572px; }
  #mumbai-budget .geo-ward { cursor: pointer; }
  #mumbai-budget .geo-ward path { fill: var(--status-fill); stroke: var(--status); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #mumbai-budget .geo-ward:hover path, #mumbai-budget .geo-ward[aria-pressed="true"] path { stroke: var(--ink); stroke-width: 2; }
  #mumbai-budget .geo-ward text { fill: var(--ink); text-anchor: middle; dominant-baseline: central; font-size: 13px; font-weight: 650; pointer-events: none; }
  #mumbai-budget .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; margin: 9px 0 0; font-size: 12px; }
  #mumbai-budget .legend span { display: inline-flex; align-items: center; gap: 5px; }
  #mumbai-budget .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--teal); background: var(--teal-fill); }
  #mumbai-budget .swatch.over { border-color: var(--rust); background: var(--rust-fill); }
  #mumbai-budget .tick { display: inline-block; width: 13px; height: 9px; border-radius: 2px; background: linear-gradient(90deg, var(--line) 65%, var(--ink) 65% 76%, var(--line) 76%); }
  #mumbai-budget .details { background: var(--panel); padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-local); min-width: 0; }
  #mumbai-budget .detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
  #mumbai-budget .area { margin-block: 4px 10px; font-size: 13px; }
  #mumbai-budget .share { font-size: 13px; color: var(--subtle); }
  #mumbai-budget .amounts { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  #mumbai-budget .amounts div { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0 8px; }
  #mumbai-budget .amounts dt { font-size: 13px; color: var(--subtle); }
  #mumbai-budget .amounts dd { font-weight: 600; }
  #mumbai-budget .footnote { margin-top: 13px; font-size: 12px; }
  #mumbai-budget .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 570px) {
    #mumbai-budget .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    #mumbai-budget .details { grid-row: 1; min-height: 150px; }
    #mumbai-budget .map-field { padding-inline: 7px; }
    #mumbai-budget .boundary-map { height: 510px; }
    #mumbai-budget .toolbar { margin-top: 12px; }
  }
  @media (pointer: coarse) {
    #mumbai-budget .switch button { min-height: 44px; }
  }
</style>
</head>
<body>
<main id="mumbai-budget">
  <header>
    <p class="period">2025 monsoon repairs</p>
    <h1>Mumbai ward repair budgets</h1>
    <p class="totals" id="mumbai-totals"></p>
  </header>
  <div class="toolbar">
    <div class="switch" role="group" aria-label="Map view">
      <button type="button" data-view="tiles" aria-pressed="true" aria-controls="mumbai-tiles">Ward tiles</button>
      <button type="button" data-view="boundaries" aria-pressed="false" aria-controls="mumbai-boundaries">Ward boundaries</button>
    </div>
    <span class="view-caption" id="mumbai-caption">Equal-sized tiles arranged roughly by location</span>
  </div>

  <div class="layout">
    <figure aria-label="Mumbai wards by share of budget spent">
      <div class="map-field">
        <div id="mumbai-tiles" class="tile-map" role="group" aria-label="Select a ward tile"></div>
        <svg id="mumbai-boundaries" class="boundary-map" viewBox="0 0 290 572" role="group" aria-label="Select a ward on the approximate boundary map" hidden></svg>
      </div>
      <figcaption class="legend">
        <span><i class="swatch" aria-hidden="true"></i> Under budget</span>
        <span><i class="swatch over" aria-hidden="true"></i> Over budget</span>
        <span id="mumbai-meter-key"><i class="tick" aria-hidden="true"></i> 100% budget mark</span>
      </figcaption>
    </figure>

    <section class="details" aria-labelledby="mumbai-selected-ward">
      <div class="detail-head">
        <h2 id="mumbai-selected-ward"></h2>
        <p class="share" id="mumbai-share"></p>
      </div>
      <p class="area" id="mumbai-area"></p>
      <dl class="amounts">
        <div><dt>Budget</dt><dd id="mumbai-ward-budget"></dd></div>
        <div><dt>Spent</dt><dd id="mumbai-ward-spend"></dd></div>
        <div><dt id="mumbai-difference-label"></dt><dd id="mumbai-difference"></dd></div>
      </dl>
      <p class="visually-hidden" role="status" id="mumbai-selection-status"></p>
    </section>
  </div>
  <p class="footnote">Synthetic data and approximate ward boundaries. Spend includes all 2,499 work orders, including entries assigned in October.</p>
</main>

<script>
(() => {
  const root = document.getElementById("mumbai-budget");
  const wards = JSON.parse(document.getElementById("mumbai-data").textContent);
  const format = new Intl.NumberFormat("en-IN");
  const rupees = value => "₹" + format.format(value);
  const crore = value => "₹" + (value / 1e7).toFixed(2) + " cr";
  const differenceLabel = ward => ({over: "Over budget", under: "Under budget", at: "At budget"})[ward.status];
  const get = id => root.querySelector("#mumbai-" + id);
  const tiles = get("tiles");
  const boundaries = get("boundaries");
  const controls = root.querySelectorAll("[data-view]");
  const svgNS = "http://www.w3.org/2000/svg";

  let budgetTotal = 0;
  let spendTotal = 0;
  let overCount = 0;
  const meterMax = Math.max(125, Math.ceil(Math.max(...wards.map(ward => 100 * ward.spend / ward.budget)) / 5) * 5);
  root.style.setProperty("--budget-mark", (100 / meterMax) * 100 + "%");

  for (const ward of wards) {
    budgetTotal += ward.budget;
    spendTotal += ward.spend;
    ward.share = 100 * ward.spend / ward.budget;
    ward.status = ward.spend > ward.budget ? "over" : ward.spend < ward.budget ? "under" : "at";
    overCount += Number(ward.status === "over");
    const label = "Ward " + ward.code + ", " + ward.name + ", " + ward.share.toFixed(1) + "% of budget spent, " + differenceLabel(ward).toLowerCase();

    const button = document.createElement("button");
    button.type = "button";
    button.className = "ward-tile " + ward.status;
    button.style.gridArea = (ward.row + 1) + " / " + (ward.col + 1);
    button.style.setProperty("--used", (ward.share / meterMax) * 100 + "%");
    button.dataset.ward = ward.code;
    button.setAttribute("aria-label", label);

    const code = document.createElement("strong");
    code.textContent = ward.code;
    const share = document.createElement("span");
    share.className = "percentage";
    share.textContent = Math.round(ward.share) + "%";
    const meter = document.createElement("span");
    meter.className = "meter";
    meter.setAttribute("aria-hidden", "true");
    button.append(code, share, meter);
    tiles.append(button);

    const group = document.createElementNS(svgNS, "g");
    group.classList.add("geo-ward", ward.status);
    group.dataset.ward = ward.code;
    group.setAttribute("role", "button");
    group.setAttribute("tabindex", "0");
    group.setAttribute("aria-label", label);
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", ward.path);
    const mapLabel = document.createElementNS(svgNS, "text");
    mapLabel.setAttribute("x", ward.x);
    mapLabel.setAttribute("y", ward.y);
    mapLabel.setAttribute("aria-hidden", "true");
    mapLabel.textContent = ward.code;
    group.append(path, mapLabel);
    boundaries.append(group);
    ward.marks = [button, group];
  }

  get("totals").textContent = crore(spendTotal) + " spent of " + crore(budgetTotal) + " budget · " + overCount + " of " + wards.length + " wards over budget";

  function selectWard(ward, announce) {
    for (const item of wards) {
      for (const mark of item.marks) mark.setAttribute("aria-pressed", String(item === ward));
    }
    get("selected-ward").textContent = "Ward " + ward.code;
    get("area").textContent = ward.name;
    get("share").textContent = ward.share.toFixed(1) + "% of budget spent";
    get("ward-budget").textContent = rupees(ward.budget);
    get("ward-spend").textContent = rupees(ward.spend);
    get("difference-label").textContent = differenceLabel(ward);
    get("difference").textContent = rupees(Math.abs(ward.spend - ward.budget));
    if (announce) {
      get("selection-status").textContent = "Ward " + ward.code + " details. " + rupees(ward.spend) + " spent of " + rupees(ward.budget) + " budget.";
    }
  }

  function selectMark(mark) {
    if (!mark) return;
    selectWard(wards.find(ward => ward.code === mark.dataset.ward), true);
  }

  root.addEventListener("click", event => {
    const control = event.target.closest("[data-view]");
    if (control) {
      const showTiles = control.dataset.view === "tiles";
      tiles.hidden = !showTiles;
      boundaries.toggleAttribute("hidden", showTiles);
      get("meter-key").hidden = !showTiles;
      get("caption").textContent = showTiles ? "Equal-sized tiles arranged roughly by location" : "Approximate boundaries from the dataset";
      for (const button of controls) button.setAttribute("aria-pressed", String(button === control));
      return;
    }
    selectMark(event.target.closest("[data-ward]"));
  });

  boundaries.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    selectMark(event.target.closest("[data-ward]"));
  });

  selectWard(wards.reduce((highest, ward) => ward.share > highest.share ? ward : highest), false);
})();
</script>
